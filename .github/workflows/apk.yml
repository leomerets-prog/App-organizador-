name: Montar APK

# Monta o app a cada mudança enviada e publica o APK numa Release fixa
# chamada "ultimo". O tablet baixa sempre do mesmo endereço, sem procurar nada.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Publicar mesmo sem suceder a versão publicada (só depois de um squash ou de reescrever o histórico)'
        type: boolean
        default: false

# Só leitura por padrão. Escrever na Release é coisa do último trabalho, e só
# dele: os passos de montar e de testar rodam código de terceiros (o
# emulador), e nada ali precisa poder mexer no repositório.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    # A versão precisa chegar nos DOIS lados: no app (que a mostra na tela) e
    # no Gradle (que a grava no APK). Por isso fica no nível do trabalho.
    env:
      APK_VERSION_CODE: ${{ github.run_number }}
      APK_VERSION_NAME: ${{ github.run_number }}-${{ github.sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      # Java 17, não 21: o Gradle 8.2 que o Capacitor traz não roda em 21.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Verificar a lógica pura
        # Tudo que apaga escrita ou classifica anotação é verificado antes de
        # virar APK: rabisco, borracha de ponta, campos, zonas e a Central.
        run: npm test

      - name: Compilar o app
        run: npm run build:tablet

      - name: Levar o app pro projeto Android
        run: npx cap sync android

      - name: Montar o APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Renomear pro nome que o tablet vê
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Organizador.apk
          ls -la dist-apk/

      # ─── O app abre mesmo? ──────────────────────────────────────────────
      #
      # Compilar não prova nada sobre abrir. Esta parte instala o APK num
      # Android de verdade e confere que ele abre, monta a tela e continua de
      # pé. Vem ANTES de publicar: APK que não abre não chega no tablet.
      # A versão que está publicada agora é a que está no tablet do usuário: a
      # verificação instala ELA primeiro e a versão nova por cima, porque é o
      # caminho que quebra — instalação limpa não reproduz o que quem atualiza
      # encontra (banco antigo, service worker já registrado).
      - name: Baixar a versão publicada hoje
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ultimo \
            --repo "$GITHUB_REPOSITORY" \
            --pattern Organizador.apk \
            --output dist-apk/anterior.apk || echo "sem versão anterior publicada"
          ls -la dist-apk/

      - name: Liberar a virtualização pro emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # `continue-on-error` aqui NÃO afrouxa a verificação: quem decide é o
      # veredito escrito pelo roteiro, conferido no passo seguinte. O que isso
      # evita é confundir "o aparelho virtual não ligou" com "o app quebrou" —
      # infraestrutura instável não pode segurar a correção que o usuário está
      # esperando, mas app reprovado tem que segurar mesmo.
      #
      # `timeout-minutes` é o freio de mão: o aparelho virtual já passou de 25
      # minutos sem ligar numa execução, e verificação que não termina vira
      # obstáculo em vez de rede de proteção. Passou do tempo, o passo morre, o
      # veredito fica ausente e a esteira segue avisando.
      - name: Abrir o app num Android de verdade
        id: emulador
        continue-on-error: true
        timeout-minutes: 14
        # Ação de terceiros presa a um commit, não a uma etiqueta que anda: ela
        # roda com a chave de assinatura no disco.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash tools/smoke-android.sh dist-apk/Organizador.apk dist-apk/logcat.txt dist-apk/anterior.apk dist-apk/veredito.txt

      - name: Ler o veredito do aparelho virtual
        run: |
          if [ ! -f dist-apk/veredito.txt ]; then
            echo "::warning::Não deu pra abrir o app no aparelho virtual (o emulador não ligou). O APK vai ser publicado sem essa verificação."
            exit 0
          fi
          if [ -s dist-apk/veredito.txt ]; then
            echo "O app reprovou na abertura:"
            cat dist-apk/veredito.txt
            exit 1
          fi
          echo "O app abriu e se manteve de pé no aparelho virtual."

      - name: Guardar o log e a foto da tela do Android
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logcat
          path: |
            dist-apk/logcat.txt
            dist-apk/logcat.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Guardar o APK como anexo da execução
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Organizador-apk
          path: dist-apk/Organizador.apk
          retention-days: 90

  # ─── Publicar ─────────────────────────────────────────────────────────
  #
  # O tablet baixa da Release "ultimo" o que estiver lá. Antes, qualquer
  # execução publicava: um ramo velho (com o banco numa versão anterior) ou a
  # repetição de uma execução antiga punha por cima um app que não abre o
  # banco do aparelho — e o caminho óbvio dali, desinstalar, apaga tudo.
  # Agora só publica o que SUCEDE a versão publicada: o commit de lá tem que
  # estar no histórico deste, e o banco não pode ter versão menor.
  publicar:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Uma publicação de cada vez; quem chegar depois confere contra a que
    # acabou de sair.
    concurrency:
      group: publicar-ultimo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Conferir que esta versão sucede a publicada
        id: sucede
        env:
          GH_TOKEN: ${{ github.token }}
          FORCAR: ${{ inputs.forcar }}
        run: |
          banco_novo=$(grep -oE 'DB_VERSION = [0-9]+' src/db/database.ts | grep -oE '[0-9]+')
          echo "banco=$banco_novo" >> "$GITHUB_OUTPUT"
          corpo=$(gh release view ultimo --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
          publicado=$(printf '%s\n' "$corpo" | grep -oE '[0-9a-f]{40}' | head -1 || true)
          banco_publicado=$(printf '%s\n' "$corpo" | grep -oE 'banco [0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          echo "Publicada: commit ${publicado:-nenhum}, banco ${banco_publicado:-?}. Esta: commit $GITHUB_SHA, banco $banco_novo."
          if [ "$FORCAR" = "true" ]; then
            echo "::warning::Publicando à força, sem conferir a sucessão."
            exit 0
          fi
          if [ -z "$publicado" ]; then
            echo "Nada publicado ainda."
            exit 0
          fi
          if [ -n "$banco_publicado" ] && [ "$banco_novo" -lt "$banco_publicado" ]; then
            echo "::error::Esta versão usa o banco $banco_novo e a publicada usa o $banco_publicado. Publicar faria o tablet abrir um banco que este app não sabe ler."
            exit 1
          fi
          if ! git cat-file -e "${publicado}^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$publicado" "$GITHUB_SHA"; then
            echo "::error::A versão publicada ($publicado) não está no histórico deste commit — esta seria mais VELHA ou de outro ramo. Não publiquei. Se o histórico foi reescrito de propósito, rode a esteira à mão com 'forcar'."
            exit 1
          fi
          echo "Sucede a publicada: pode publicar."

      - uses: actions/download-artifact@v4
        with:
          name: Organizador-apk
          path: dist-apk

      - name: Publicar na Release "ultimo"
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ultimo
          name: Organizador — versão mais recente
          # O commit e o banco escritos aqui são o que a próxima execução
          # confere antes de publicar por cima — não mude o formato sem mudar
          # a conferência.
          body: |
            Versão ${{ github.run_number }}, do commit ${{ github.sha }} (banco ${{ steps.sucede.outputs.banco }}).

            **Para instalar ou atualizar no tablet:** baixe o `Organizador.apk`
            abaixo e toque no arquivo. As anotações que já estão no aparelho
            são preservadas.
          files: dist-apk/Organizador.apk
          make_latest: true
