name: Montar APK

# Monta o app a cada mudança enviada e publica o APK numa Release fixa
# chamada "ultimo". O tablet baixa sempre do mesmo endereço, sem procurar nada.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    # A versão precisa chegar nos DOIS lados: no app (que a mostra na tela) e
    # no Gradle (que a grava no APK). Por isso fica no nível do trabalho.
    env:
      APK_VERSION_CODE: ${{ github.run_number }}
      APK_VERSION_NAME: ${{ github.run_number }}-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Java 17, não 21: o Gradle 8.2 que o Capacitor traz não roda em 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Verificar a lógica pura
        # Tudo que apaga escrita ou classifica anotação é verificado antes de
        # virar APK: rabisco, borracha de ponta, campos, zonas e a Central.
        run: npm test

      - name: Compilar o app
        run: npm run build:tablet

      - name: Levar o app pro projeto Android
        run: npx cap sync android

      - name: Montar o APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Renomear pro nome que o tablet vê
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Organizador.apk
          ls -la dist-apk/

      # ─── O app abre mesmo? ──────────────────────────────────────────────
      #
      # Compilar não prova nada sobre abrir. Esta parte instala o APK num
      # Android de verdade e confere que ele abre, monta a tela e continua de
      # pé. Vem ANTES de publicar: APK que não abre não chega no tablet.
      # A versão que está publicada agora é a que está no tablet do usuário: a
      # verificação instala ELA primeiro e a versão nova por cima, porque é o
      # caminho que quebra — instalação limpa não reproduz o que quem atualiza
      # encontra (banco antigo, service worker já registrado).
      - name: Baixar a versão publicada hoje
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ultimo \
            --repo "$GITHUB_REPOSITORY" \
            --pattern Organizador.apk \
            --output dist-apk/anterior.apk || echo "sem versão anterior publicada"
          ls -la dist-apk/

      - name: Liberar a virtualização pro emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # `continue-on-error` aqui NÃO afrouxa a verificação: quem decide é o
      # veredito escrito pelo roteiro, conferido no passo seguinte. O que isso
      # evita é confundir "o aparelho virtual não ligou" com "o app quebrou" —
      # infraestrutura instável não pode segurar a correção que o usuário está
      # esperando, mas app reprovado tem que segurar mesmo.
      - name: Abrir o app num Android de verdade
        id: emulador
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/smoke-android.sh dist-apk/Organizador.apk dist-apk/logcat.txt dist-apk/anterior.apk dist-apk/veredito.txt

      - name: Ler o veredito do aparelho virtual
        run: |
          if [ ! -f dist-apk/veredito.txt ]; then
            echo "::warning::Não deu pra abrir o app no aparelho virtual (o emulador não ligou). O APK vai ser publicado sem essa verificação."
            exit 0
          fi
          if [ -s dist-apk/veredito.txt ]; then
            echo "O app reprovou na abertura:"
            cat dist-apk/veredito.txt
            exit 1
          fi
          echo "O app abriu e se manteve de pé no aparelho virtual."

      - name: Guardar o log do Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: dist-apk/logcat.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Guardar o APK como anexo da execução
        uses: actions/upload-artifact@v4
        with:
          name: Organizador-apk
          path: dist-apk/Organizador.apk
          retention-days: 90

      - name: Publicar na Release "ultimo"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultimo
          name: Organizador — versão mais recente
          body: |
            Versão ${{ github.run_number }}, do commit ${{ github.sha }}.

            **Para instalar ou atualizar no tablet:** baixe o `Organizador.apk`
            abaixo e toque no arquivo. As anotações que já estão no aparelho
            são preservadas.
          files: dist-apk/Organizador.apk
          make_latest: true
